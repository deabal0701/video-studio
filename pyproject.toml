[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-studio"
version = "0.0.1"
description = "강좌(시리즈) 영상 제작 스튜디오 — 파일 SSOT · FastAPI · engine(Node CLI) subprocess"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.7",
  "sse-starlette>=2.1",
  "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]
# 에이전트(4단계) — 키 없으면 앱이 이 그룹 없이도 완결 동작한다
agent = ["claude-agent-sdk>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# SSE·잡 큐가 블로킹 스트림을 다루므로 회귀로 매달리면 곧장 드러나게 한다
timeout = 60
