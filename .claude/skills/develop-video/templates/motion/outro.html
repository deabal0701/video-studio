<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>아웃트로</title>
    <link rel="stylesheet" href="_base.css" />
    <style>
      /* 마지막 화면. 홍보라면 행동 유도(CTA), 매뉴얼이라면 마무리 안내로 쓴다. */
      .mark {
        width: 8vh;
        height: 8vh;
        border-radius: 999px;
        background: var(--brand);
        box-shadow: 0 0 5vh color-mix(in srgb, var(--brand) 70%, transparent);
        animation-name: markIn;
        animation-duration: 0.7s;
        animation-timing-function: cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      @keyframes markIn {
        from { opacity: 0; transform: scale(0.3); }
        to   { opacity: 1; transform: scale(1); }
      }

      .title > span {
        animation-name: riseUp;
        animation-duration: 0.7s;
        animation-delay: 0.3s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      .subtitle > span {
        animation-name: fadeUp;
        animation-duration: 0.6s;
        animation-delay: 0.65s;
        animation-timing-function: ease-out;
      }

      /* CTA 알약 — 테두리가 그려지고 글자가 떠오른다 */
      .cta {
        margin-top: 1.6vh;
        padding: 1.6vh 4vh;
        border: 0.35vh solid var(--brand-soft);
        border-radius: 999px;
        font-size: 3.2vh;
        font-weight: 700;
        color: var(--fg);
        animation-name: ctaIn;
        animation-duration: 0.6s;
        animation-delay: 0.95s;
        animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes ctaIn {
        from { opacity: 0; transform: translateY(2vh) scale(0.94); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
      }

      .url {
        margin-top: 0.6vh;
        font-size: 2.6vh;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--brand-soft);
        animation-name: fadeUp;
        animation-duration: 0.5s;
        animation-delay: 1.25s;
        animation-timing-function: ease-out;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="glow animated"></div>
      <div class="mark animated"></div>
      <div class="reveal title"><span class="animated" data-p="title">제품 이름</span></div>
      <div class="subtitle"><span class="animated" data-p="subtitle"></span></div>
      <div class="cta animated" data-p="cta"></div>
      <div class="url animated" data-p="url"></div>
    </div>
    <script src="_params.js"></script>
  </body>
</html>
