<!doctype html>
<meta charset="utf-8">
<title>오토스케일링</title>
<!-- 확장성을 '시간에 따라 실제로 변하는' 그림으로 보여 준다. 이 개념은 정지 그림으로는
     설명이 안 된다 — 손님(요청)이 몰리면 서버가 늘어나고, 빠지면 도로 줄어드는 것이 요점이다.

     위: 요청 막대 그래프가 가운데에서 치솟았다 가라앉는다.
     아래: 서버 아이콘이 따라서 1 → 5 → 1 로 늘었다 줄어든다.
     왼쪽 점선: 직접 산 서버의 고정 용량 — 평소에는 남고 몰릴 때는 모자란다.

     params:
       title  상단 문구
       note   하단 보조 문구
       wipe=off

     주의: `animation:` 단축 속성을 쓰지 않는다. 9:16 대비 가운데 46% 안에 둔다. -->
<link rel="stylesheet" href="_base.css">
<style>
  .stage { padding: 0 25%; justify-content: center; gap: 2.2vh; }

  .head {
    font-size: 5.0vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25;
    animation-name: fadeUp; animation-duration: 0.7s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  .panel {
    position: relative; width: 100%; height: 22vh;
    border-radius: 1.4vh; background: linear-gradient(#0d1730, #141e3c);
    border: 0.26vh solid #2a3960; padding: 1.2vh 1.4vh;
  }
  .plabel {
    position: absolute; left: 1.4vh; top: 1.0vh;
    font-size: 2.0vh; font-weight: 700; color: #8fa0c8; letter-spacing: -0.02em;
  }

  /* ── 요청 그래프 ── */
  /* 막대는 각자 다른 최종 높이를 가진다 — 가운데(명절)가 가장 높다.
     height 를 고정하고 scaleY 로 흔들면 전부 같은 높이로 보이므로,
     높이는 인라인 style 로 각각 주고 애니메이션은 '자라나는 것'만 담당한다. */
  .bars { position: absolute; inset: auto 1.4vh 1.2vh 1.4vh; height: 16.5vh;
          display: flex; align-items: flex-end; gap: 0.5vh; }
  .bars i {
    display: block; flex: 1; border-radius: 0.4vh 0.4vh 0 0;
    background: linear-gradient(#6f8ad6, #3f5aa8);
    transform-origin: bottom center;
    animation-name: grow; animation-duration: 3.4s;
    animation-timing-function: cubic-bezier(0.4,0,0.4,1);
  }
  /* 한계선을 넘는 막대는 주황으로 — "직접 산 서버로는 못 받는 손님"이 색으로 보인다 */
  .bars i.over { background: linear-gradient(#ffab85, #e2683a); }

  /* 고정 용량선 — 직접 산 서버는 여기서 멈춘다. 낮은 막대보다는 위, 높은 막대보다는 아래 */
  .cap {
    position: absolute; left: 1.4vh; right: 1.4vh; bottom: 7.2vh;
    border-top: 0.3vh dashed #ff8f6b; z-index: 2;
  }
  .capText {
    position: absolute; left: 1.6vh; bottom: 7.6vh; z-index: 3;
    font-size: 1.85vh; font-weight: 800; color: #ffb094;
    background: rgba(10,18,38,0.82); padding: 0 0.6vh; border-radius: 0.4vh;
  }

  /* ── 서버 ── */
  .servers { position: absolute; inset: auto 1.4vh 1.4vh 1.4vh; height: 10vh;
             display: flex; align-items: flex-end; justify-content: center; gap: 1.0vh; }
  .srv {
    width: 4.2vh; height: 8.4vh; border-radius: 0.6vh;
    background: linear-gradient(#3f6ecb, #2b4a97);
    border: 0.24vh solid #7ea2ee; position: relative;
    transform-origin: bottom center;
  }
  .srv::after {
    content: ''; position: absolute; left: 0.6vh; top: 0.7vh;
    width: 0.8vh; height: 0.8vh; border-radius: 50%; background: #7ee0a8;
  }
  /* 늘어나는 4대. 막대가 치솟는 동안 한 대씩 붙고, 손님이 빠지면 붙은 역순으로 사라진다.
     하나의 키프레임에 서로 다른 지연을 주면 "동시에 다섯 대"가 아니라 "차례로 는다"로 읽힌다. */
  .srv.add { animation-name: addSrv; animation-duration: 3.4s;
             animation-timing-function: cubic-bezier(0.3,0.8,0.3,1); }
  .srv.a1 { animation-delay: -0.10s; }
  .srv.a2 { animation-delay: -0.28s; }
  .srv.a3 { animation-delay: -0.46s; }
  .srv.a4 { animation-delay: -0.64s; }

  .note {
    font-size: 2.7vh; color: #93a4cc; line-height: 1.5;
    animation-name: fadeUp; animation-duration: 0.7s; animation-delay: 1.0s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  /* 막대는 제 높이까지 자라기만 한다 — 높낮이 차이는 인라인 height 가 만든다 */
  @keyframes grow {
    0%   { transform: scaleY(0); }
    100% { transform: scaleY(1); }
  }
  /* 서버: 몰릴 때만 존재한다 */
  @keyframes addSrv {
    0%,34%   { opacity: 0; transform: scaleY(0.1); }
    46%      { opacity: 1; transform: scaleY(1); }
    72%      { opacity: 1; transform: scaleY(1); }
    86%,100% { opacity: 0; transform: scaleY(0.1); }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(2.2vh); } to { opacity: 1; transform: none; } }
</style>

<div class="stage">
  <div class="head animated" data-p="title">몰릴 때만 늘리고, 끝나면 줄인다</div>

  <div class="panel">
    <div class="plabel">들어오는 손님</div>
    <div class="bars">
      <i class="animated" style="height:22%;animation-delay:0.10s"></i>
      <i class="animated" style="height:26%;animation-delay:0.16s"></i>
      <i class="animated" style="height:24%;animation-delay:0.22s"></i>
      <i class="animated over" style="height:58%;animation-delay:0.28s"></i>
      <i class="animated over" style="height:82%;animation-delay:0.34s"></i>
      <i class="animated over" style="height:100%;animation-delay:0.40s"></i>
      <i class="animated over" style="height:94%;animation-delay:0.46s"></i>
      <i class="animated over" style="height:70%;animation-delay:0.52s"></i>
      <i class="animated" style="height:34%;animation-delay:0.58s"></i>
      <i class="animated" style="height:25%;animation-delay:0.64s"></i>
      <i class="animated" style="height:22%;animation-delay:0.70s"></i>
      <i class="animated" style="height:20%;animation-delay:0.76s"></i>
    </div>
    <div class="cap"></div>
    <div class="capText">직접 산 서버의 한계</div>
  </div>

  <div class="panel" style="height:13vh">
    <div class="plabel">클라우드가 내주는 컴퓨터</div>
    <div class="servers">
      <span class="srv"></span>
      <span class="srv add a1 animated"></span>
      <span class="srv add a2 animated"></span>
      <span class="srv add a3 animated"></span>
      <span class="srv add a4 animated"></span>
    </div>
  </div>

  <div class="note animated" data-p="note">평소엔 한 대, 명절엔 다섯 대 — 몇 분이면 된다</div>
  <div class="wipe animated"></div>
</div>
<script src="_params.js"></script>
