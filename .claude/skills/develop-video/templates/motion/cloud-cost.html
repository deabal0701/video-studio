<!doctype html>
<meta charset="utf-8">
<title>미리 사는 돈 vs 쓴 만큼</title>
<!-- 비용 구조를 그림으로. 왼쪽은 시작하자마자 큰 돈이 한 번에 나가고 그 뒤로도 계속 깔린다(계단).
     오른쪽은 시작이 0 에 가깝고 쓴 만큼만 조금씩 오른다. 두 그래프의 '시작점 높이'가
     이 그림의 요점이다 — 글자 없이도 왼쪽이 처음부터 높다는 게 보인다.

     params:
       title  상단 문구
       left   왼쪽 이름표
       right  오른쪽 이름표
       note   하단 보조 문구
       wipe=off

     주의: `animation:` 단축 속성을 쓰지 않는다. 9:16 대비 가운데 46% 안. -->
<link rel="stylesheet" href="_base.css">
<style>
  .stage { padding: 0 25%; justify-content: center; gap: 2.6vh; }

  .head {
    font-size: 4.9vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25;
    animation-name: fadeUp; animation-duration: 0.7s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  .cols { display: flex; gap: 2.0vh; width: 100%; height: 28vh; }
  .col {
    position: relative; flex: 1; border-radius: 1.5vh; padding: 1.4vh 1.4vh 1.0vh;
    background: linear-gradient(#0e1730, #16203f); border: 0.26vh solid #2a3960;
    display: flex; flex-direction: column;
  }
  .col.pick { border-color: var(--brand); background: linear-gradient(#101d3f,#14284f); }
  .cap { font-size: 2.3vh; font-weight: 800; color: #9fb0d8; margin-bottom: 0.8vh; }
  .col.pick .cap { color: var(--brand-soft); }

  .plot { position: relative; flex: 1; border-left: 0.22vh solid #35456f;
          border-bottom: 0.22vh solid #35456f; }

  /* 계단식 비용 — 시작부터 높다 */
  .step {
    position: absolute; bottom: 0; border-radius: 0.3vh 0.3vh 0 0;
    background: linear-gradient(#ff9f6e, #e2683a);
    transform-origin: bottom center;
    animation-name: rise; animation-duration: 2.6s;
    animation-timing-function: cubic-bezier(0.3,0.8,0.3,1);
  }
  /* 쓴 만큼 — 낮게 시작해 천천히 */
  .step.soft { background: linear-gradient(#7ea2ee, #3f6ecb); }

  .axis { position: absolute; left: 0; right: 0; bottom: -2.4vh;
          font-size: 1.7vh; color: #7b8ab2; display: flex; justify-content: space-between; }

  .tag {
    position: absolute; font-size: 1.9vh; font-weight: 800; padding: 0.3vh 0.8vh;
    border-radius: 0.5vh; animation-name: fadeUp; animation-duration: 0.6s;
  }
  .tag.big { color: #3a1c0c; background: #ffb083; left: 0.6vh; top: 0.4vh; animation-delay: 1.0s; }
  .tag.zero { color: #06264f; background: #a8c8ff; left: 0.6vh; bottom: 0.6vh; animation-delay: 1.0s; }

  .note {
    font-size: 2.6vh; color: #93a4cc; line-height: 1.5;
    animation-name: fadeUp; animation-duration: 0.7s; animation-delay: 1.4s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  .c1 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 0.2s;
        animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .c2 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 0.45s;
        animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(2.2vh); } to { opacity: 1; transform: none; } }
  @keyframes rise   { from { transform: scaleY(0); } to { transform: scaleY(1); } }
</style>

<div class="stage">
  <div class="head animated" data-p="title">시작할 때 드는 돈이 다르다</div>

  <div class="cols">
    <div class="col animated c1">
      <div class="cap" data-p="left">직접 산다</div>
      <div class="plot">
        <span class="step animated" style="left:4%;width:14%;height:78%;animation-delay:0.30s"></span>
        <span class="step animated" style="left:22%;width:14%;height:80%;animation-delay:0.38s"></span>
        <span class="step animated" style="left:40%;width:14%;height:82%;animation-delay:0.46s"></span>
        <span class="step animated" style="left:58%;width:14%;height:84%;animation-delay:0.54s"></span>
        <span class="step animated" style="left:76%;width:14%;height:86%;animation-delay:0.62s"></span>
        <div class="tag big animated">처음부터 큰돈</div>
        <div class="axis"><span>시작</span><span>시간</span></div>
      </div>
    </div>

    <div class="col pick animated c2">
      <div class="cap" data-p="right">빌려 쓴다</div>
      <div class="plot">
        <span class="step soft animated" style="left:4%;width:14%;height:8%;animation-delay:0.30s"></span>
        <span class="step soft animated" style="left:22%;width:14%;height:16%;animation-delay:0.38s"></span>
        <span class="step soft animated" style="left:40%;width:14%;height:26%;animation-delay:0.46s"></span>
        <span class="step soft animated" style="left:58%;width:14%;height:38%;animation-delay:0.54s"></span>
        <span class="step soft animated" style="left:76%;width:14%;height:52%;animation-delay:0.62s"></span>
        <div class="tag zero animated">0 에서 시작</div>
        <div class="axis"><span>시작</span><span>시간</span></div>
      </div>
    </div>
  </div>

  <div class="note animated" data-p="note">쓴 만큼만 — 전기 요금과 같은 방식</div>
  <div class="wipe animated"></div>
</div>
<script src="_params.js"></script>
