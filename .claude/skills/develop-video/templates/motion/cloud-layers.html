<!doctype html>
<meta charset="utf-8">
<title>어디까지 빌리나 — 3층</title>
<!-- IaaS/PaaS/SaaS 를 약어 없이 보여 준다. 요점은 "무엇을 내가 맡고 무엇을 빌리는가"이므로
     같은 5개 층을 세 번 그리고, 내가 맡는 칸만 밝게(주황) 칠한다. 오른쪽으로 갈수록
     밝은 칸이 줄어든다 — 그게 이 그림의 전부이고, 글자 없이도 읽힌다.

     집 비유와 짝을 이룬다: 땅만 빌린다 / 뼈대까지 빌린다 / 몸만 들어간다.

     params:
       title  상단 문구
       c1 c2 c3   세 기둥의 이름표
       note   하단 보조 문구
       wipe=off

     주의: `animation:` 단축 속성을 쓰지 않는다. 9:16 대비 가운데 46% 안. -->
<link rel="stylesheet" href="_base.css">
<style>
  .stage { padding: 0 24%; justify-content: center; gap: 2.4vh; }

  .head {
    font-size: 4.8vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25;
    animation-name: fadeUp; animation-duration: 0.7s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  .cols { display: flex; gap: 1.6vh; width: 100%; align-items: flex-end; }
  .col { flex: 1; display: flex; flex-direction: column; gap: 0.7vh; }

  .cap { font-size: 2.3vh; font-weight: 800; color: #cfe0ff; margin-bottom: 0.5vh; line-height: 1.25; }
  .sub { font-size: 1.8vh; color: #8ea0c8; margin-top: 0.4vh; line-height: 1.3; }

  .row {
    height: 3.5vh; border-radius: 0.6vh;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.75vh; font-weight: 700; letter-spacing: -0.02em;
  }
  /* 빌리는 칸 — 어둡고 잠잠하다 */
  .rent { background: #1a2544; color: #6f80a8; border: 0.2vh solid #27355c; }
  /* 내가 맡는 칸 — 밝은 주황. 시선이 여기로 간다 */
  .mine { background: linear-gradient(#ff9f6e, #f47c45); color: #3a1c0c; border: 0.2vh solid #ffc2a0; }

  .legend { display: flex; gap: 2.4vh; justify-content: center; font-size: 2.1vh; color: #93a4cc; }
  .legend i { display: inline-block; width: 2.2vh; height: 1.5vh; border-radius: 0.35vh;
              vertical-align: -0.15vh; margin-right: 0.7vh; }
  .legend .m { background: linear-gradient(#ff9f6e,#f47c45); }
  .legend .r { background: #1a2544; border: 0.2vh solid #27355c; }

  .k1 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 0.20s;
        animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .k2 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 0.55s;
        animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .k3 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 0.90s;
        animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .k4 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 1.25s;
        animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }

  .note {
    font-size: 2.6vh; color: #93a4cc; line-height: 1.5;
    animation-name: fadeUp; animation-duration: 0.7s; animation-delay: 1.5s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(2.2vh); } to { opacity: 1; transform: none; } }
</style>

<div class="stage">
  <div class="head animated" data-p="title">어디까지 빌릴 것인가</div>

  <div class="cols">
    <div class="col animated k1">
      <div class="cap" data-p="c1">땅만 빌린다</div>
      <div class="row mine">내 프로그램</div>
      <div class="row mine">설치·설정</div>
      <div class="row mine">운영체제</div>
      <div class="row rent">컴퓨터</div>
      <div class="row rent">건물·전기</div>
      <div class="sub">직접 지어 올린다</div>
    </div>

    <div class="col animated k2">
      <div class="cap" data-p="c2">뼈대까지 빌린다</div>
      <div class="row mine">내 프로그램</div>
      <div class="row rent">설치·설정</div>
      <div class="row rent">운영체제</div>
      <div class="row rent">컴퓨터</div>
      <div class="row rent">건물·전기</div>
      <div class="sub">안만 꾸민다</div>
    </div>

    <div class="col animated k3">
      <div class="cap" data-p="c3">몸만 들어간다</div>
      <div class="row rent">프로그램</div>
      <div class="row rent">설치·설정</div>
      <div class="row rent">운영체제</div>
      <div class="row rent">컴퓨터</div>
      <div class="row rent">건물·전기</div>
      <div class="sub">메일 · 메신저 · 사진 백업</div>
    </div>
  </div>

  <div class="legend animated k4">
    <span><i class="m"></i>내가 맡는다</span>
    <span><i class="r"></i>빌린다</span>
  </div>

  <div class="note animated" data-p="note">오른쪽으로 갈수록 내 손이 덜 간다</div>
  <div class="wipe animated"></div>
</div>
<script src="_params.js"></script>
