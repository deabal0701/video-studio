<!doctype html>
<meta charset="utf-8">
<title>사는 것 vs 빌리는 것</title>
<!-- 클라우드의 한 줄 정의를 그림으로 — 왼쪽은 내 돈으로 산 서버 한 대(내 방에 있다),
     오른쪽은 남의 데이터센터에서 필요한 만큼 빌려 쓰는 그림.
     "남의 컴퓨터를 빌려 쓴다"를 글자가 아니라 배치로 보여 준다.

     params:
       title   상단 문구
       left    왼쪽 이름표 (기본 "직접 산다")
       right   오른쪽 이름표 (기본 "빌려 쓴다")
       note    하단 보조 문구
       wipe=off

     주의: `animation:` 단축 속성을 쓰지 않는다(_base.css 주석 참조).
     9:16 은 가운데 50%만 남으므로 그림을 가운데 46% 안에 둔다. -->
<link rel="stylesheet" href="_base.css">
<style>
  .stage { padding: 0 25%; justify-content: center; gap: 2.6vh; }

  .head {
    font-size: 5.0vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25;
    animation-name: fadeUp; animation-duration: 0.7s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  .cols { display: flex; align-items: stretch; gap: 2.2vh; width: 100%; height: 34vh; }

  .col {
    position: relative; flex: 1; border-radius: 1.6vh;
    background: linear-gradient(#0e1730, #16203f);
    border: 0.28vh solid #2b3a63;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1.4vh; padding: 1.6vh;
  }
  /* 오른쪽(빌리는 쪽)을 브랜드색으로 물들여 "이쪽이 클라우드"임을 색으로 구분한다 */
  .col.pick { border-color: var(--brand); background: linear-gradient(#101d3f, #14284f); }

  .caption { font-size: 2.5vh; font-weight: 700; color: #9fb0d8; }
  .col.pick .caption { color: var(--brand-soft); }

  /* 서버 상자 */
  .rack { display: flex; gap: 0.8vh; align-items: flex-end; height: 13vh; }
  .box {
    width: 3.0vh; border-radius: 0.5vh;
    background: linear-gradient(#5f6d9c, #414d78);
    border: 0.22vh solid #8493c2;
    position: relative;
  }
  .box::after {
    content: ''; position: absolute; left: 0.5vh; top: 0.6vh;
    width: 0.7vh; height: 0.7vh; border-radius: 50%; background: #7ee0a8;
  }
  .col.pick .box { background: linear-gradient(#3f6ecb, #2f4fa0); border-color: var(--brand-soft); }

  /* 내 방 = 한 대뿐, 크게. 데이터센터 = 여러 대 */
  .one { height: 11vh; width: 4.6vh; }

  /* 건물(데이터센터) 윤곽 — 빌리는 쪽 배경에 깔아 "남의 건물"임을 보여 준다 */
  /* 건물 띠는 아래쪽에만 얕게 깐다 — 높으면 '남의 건물 안'이 아니라 글자 가리개가 된다 */
  .bldg {
    position: absolute; inset: auto 0 0 0; height: 5.5vh;
    background: repeating-linear-gradient(90deg,#1b2b52 0 2.2vh,#22345f 2.2vh 4.4vh);
    border-top: 0.3vh solid #33477a; opacity: 0.7;
    border-radius: 0 0 1.3vh 1.3vh;
  }

  .price { font-size: 2.2vh; color: #8d9cc4; }
  .col.pick .price { color: #bcd2ff; }

  .note {
    font-size: 2.7vh; color: #93a4cc; line-height: 1.5;
    animation-name: fadeUp; animation-duration: 0.7s; animation-delay: 1.1s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  /* 왼→오 화살표: 세상이 옮겨 간 방향 */
  .arrow {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    font-size: 3.4vh; color: var(--brand-soft);
    animation-name: pop; animation-duration: 0.5s; animation-delay: 0.9s;
    animation-timing-function: cubic-bezier(0.2,0.9,0.3,1.2);
  }

  .c1 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 0.25s;
        animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .c2 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 0.6s;
        animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(2.2vh); } to { opacity: 1; transform: none; } }
  @keyframes pop    { from { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
                      to   { opacity: 1; transform: translate(-50%,-50%) scale(1); } }
</style>

<div class="stage">
  <div class="head animated" data-p="title">사는 게 아니라 빌린다</div>

  <div class="cols" style="position:relative">
    <div class="col animated c1">
      <div class="caption" data-p="left">직접 산다</div>
      <div class="rack"><span class="box one"></span></div>
      <div class="price">한 대를 통째로 · 미리</div>
    </div>

    <div class="arrow animated">→</div>

    <div class="col pick animated c2">
      <div class="bldg"></div>
      <div class="caption" data-p="right">빌려 쓴다</div>
      <div class="rack" style="position:relative;z-index:1">
        <span class="box" style="height:6vh"></span>
        <span class="box" style="height:8.5vh"></span>
        <span class="box" style="height:7vh"></span>
        <span class="box" style="height:9.5vh"></span>
      </div>
      <div class="price">남의 건물에서 · 필요한 만큼</div>
    </div>
  </div>

  <div class="note animated" data-p="note">클라우드 = 잘 관리되는 남의 컴퓨터</div>
  <div class="wipe animated"></div>
</div>
<script src="_params.js"></script>
