<!doctype html>
<meta charset="utf-8">
<title>course stinger</title>
<!-- 강좌 시그니처 인트로(스팅어) — 회차마다 **똑같이** 반복되는 3초.
     구독자가 눈이 아니라 몸으로 "그 강좌"를 알아보는 자리다. 그래서 params 로 받는 것은
     강좌명(brandline)과 태그라인뿐이고, 회차 정보(n강·제목)는 여기 들어오지 않는다 —
     그건 뒤따르는 course-intro.html(타이틀 카드)의 몫이다.

     연출: 브랜드 점 하나가 떨어져 눌리며 파문 → 그 파문에서 가로선이 양쪽으로 자라고
     강좌명이 선 위로 올라선다 → 태그라인. 개념강좌의 "한 점에서 시작해 넓어진다"는
     은유이고, 3초 안에 끝나 이탈 구간을 잡아먹지 않는다.

     params:
       brandline  강좌명 (워터마크와 같은 문구 — 예: "직장인 5분 개념강좌")
       tagline    한 줄 태그라인 (선택 — 예: "개념 하나를, 5분에")
       wipe=off   모션끼리 이어질 때

     주의: `animation:` 단축 속성 금지(_base.css 주석). 가운데 정렬은 left/right:0 +
     text-align 으로 — fadeUp·riseUp 키프레임이 transform 을 덮어쓴다. -->
<link rel="stylesheet" href="../../../engine/motion/_base.css">
<style>
  :root { --bg: #05070d; }

  .stage { padding: 0 14%; gap: 0; }

  .mark {
    position: relative;
    width: 12vh;
    height: 12vh;
    margin-bottom: 3.4vh;
  }
  /* 점 — 위에서 떨어져 한 번 눌린다 */
  .mark .dot {
    position: absolute;
    inset: 30%;
    border-radius: 999px;
    background: var(--brand);
    box-shadow: 0 0 7vh color-mix(in srgb, var(--brand) 80%, transparent);
    animation-name: dropIn;
    animation-duration: 0.55s;
    animation-timing-function: cubic-bezier(0.2, 1.5, 0.4, 1);
  }
  @keyframes dropIn {
    0%   { opacity: 0; transform: scale(0.25) translateY(-7vh); }
    58%  { opacity: 1; transform: scale(1.16); }
    74%  { transform: scale(0.9); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* 완성 뒤 남는 구간 — 점이 은은히 숨쉬어 정지 화면으로 보이지 않는다 */
  .mark .pulse {
    position: absolute;
    inset: 26%;
    border-radius: 999px;
    background: color-mix(in srgb, var(--brand) 55%, transparent);
    opacity: 0;
    animation-name: breathe;
    animation-duration: 1.5s;
    animation-delay: 1.5s;
    animation-timing-function: ease-in-out;
  }
  @keyframes breathe {
    0%   { opacity: 0; transform: scale(1); }
    45%  { opacity: 0.55; transform: scale(1.55); }
    100% { opacity: 0; transform: scale(2.05); }
  }

  /* 파문 — 눌린 순간 퍼진다 */
  .mark .ring {
    position: absolute;
    inset: 0;
    border: 0.45vh solid var(--brand-soft);
    border-radius: 999px;
    animation-name: ripple;
    animation-duration: 0.85s;
    animation-delay: 0.38s;
    animation-timing-function: ease-out;
  }
  @keyframes ripple {
    from { opacity: 0.85; transform: scale(0.85); }
    to   { opacity: 0; transform: scale(2.5); }
  }

  /* 가로선 — 파문에서 이어받아 양쪽으로 자란다 */
  .rule {
    width: 46vh;
    height: 0.42vh;
    border-radius: 0.3vh;
    background: linear-gradient(90deg, transparent, var(--brand), transparent);
    transform-origin: center;
    animation-name: spread;
    animation-duration: 0.5s;
    animation-delay: 0.52s;
    animation-timing-function: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  @keyframes spread { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  /* 강좌명 — 선 위로 올라선다 */
  .brandline {
    overflow: hidden;
    margin-top: 3vh;
    font-size: 7vh;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .brandline > span {
    display: block;
    animation-name: riseUp;
    animation-duration: 0.6s;
    animation-delay: 0.72s;
    animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
  }

  .tagline {
    margin-top: 1.6vh;
    font-size: 2.9vh;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--brand-soft);
    animation-name: fadeUp;
    animation-duration: 0.5s;
    animation-delay: 1.08s;
  }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="mark">
    <span class="dot animated"></span>
    <span class="ring animated"></span>
    <span class="pulse animated"></span>
  </div>

  <div class="rule animated"></div>
  <div class="brandline"><span class="animated" data-p="brandline"></span></div>
  <div class="tagline animated" data-p="tagline"></div>
</div>

<div class="wipe animated"></div>

<script src="../../../engine/motion/_params.js"></script>
