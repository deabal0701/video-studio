<!doctype html>
<meta charset="utf-8">
<title>hook — 출근 전인데 요금이 붙는다</title>
<!-- 훅: 구체적 장면의 반전. 이름 한 줄 → 첫 출근 D-7 → 그런데 청구서가 찍힌다.
     정답 라벨('계정 상태 = 활성화')은 여기서 공개하지 않는다 — s2b 에서 회수한다.
     발화 시각(실측 9.10s / 52자 기준): 0.15 이름 / 3.2 첫 출근 다음 주 / 6.9 청구 / 7.9 강조 -->
<link rel="stylesheet" href="../../../../engine/motion/_base.css">
<style>
  .stage { padding: 0 10%; gap: 0; }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 3vh;
    width: 78vh;
    padding: 3.4vh 4vh;
    border-radius: 1.6vh;
    background: #1d1108;
    border: 0.2vh solid #4a2d16;
    text-align: left;
    animation-name: fadeUp;
    animation-duration: 0.6s;
    animation-delay: 0.15s;
  }
  .avatar {
    flex: none;
    width: 8.4vh;
    height: 8.4vh;
    border-radius: 999px;
    background: color-mix(in srgb, var(--brand) 26%, transparent);
    border: 0.24vh solid var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.6vh;
    font-weight: 800;
    color: var(--brand-soft);
  }
  .who .name { font-size: 4.4vh; font-weight: 800; letter-spacing: -0.02em; }
  .who .role { margin-top: 0.6vh; font-size: 2.4vh; font-weight: 600; color: #a08b78; }

  /* 첫 출근 D-7 — 아직 오지 않았다는 표시 */
  .dday {
    margin-top: 4.2vh;
    display: inline-flex;
    align-items: center;
    gap: 1.4vh;
    padding: 1.4vh 2.8vh;
    border-radius: 999px;
    background: #17212e;
    border: 0.2vh solid #2f4560;
    font-size: 2.9vh;
    font-weight: 700;
    color: #9fc0e6;
    animation-name: fadeUp;
    animation-duration: 0.5s;
    animation-delay: 3.2s;
  }
  .dday .dot { width: 1.1vh; height: 1.1vh; border-radius: 999px; background: #4d7fb5; }

  /* 청구서 — 비스듬히 찍히듯 들어온다 */
  .bill {
    margin-top: 5.4vh;
    display: flex;
    align-items: baseline;
    gap: 2.2vh;
    padding: 2.4vh 4.4vh;
    border-radius: 1.2vh;
    background: color-mix(in srgb, var(--brand) 18%, #1d1108);
    border: 0.28vh solid var(--brand);
    box-shadow: 0 1.4vh 5vh rgb(0 0 0 / 0.55);
    animation-name: stamp;
    animation-duration: 0.5s;
    animation-delay: 6.9s;
    animation-timing-function: cubic-bezier(0.2, 1.4, 0.4, 1);
  }
  @keyframes stamp {
    from { opacity: 0; transform: scale(1.5) rotate(-7deg); }
    to   { opacity: 1; transform: scale(1) rotate(-2.2deg); }
  }
  .bill .label { font-size: 2.7vh; font-weight: 700; color: var(--brand-soft); }
  .bill .amount { font-size: 5.6vh; font-weight: 900; letter-spacing: -0.03em; }

  .pulse {
    position: absolute;
    inset: -1.2vh;
    border-radius: 1.6vh;
    border: 0.3vh solid var(--brand);
    opacity: 0;
    animation-name: ping;
    animation-duration: 1.1s;
    animation-delay: 7.9s;
    animation-timing-function: ease-out;
  }
  @keyframes ping {
    from { opacity: 0.9; transform: scale(1); }
    to   { opacity: 0; transform: scale(1.12); }
  }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="card animated">
    <div class="avatar">김</div>
    <div class="who">
      <div class="name">김민준</div>
      <div class="role">신규 구성원 · 초대 수락함</div>
    </div>
  </div>

  <div class="dday animated"><span class="dot"></span>첫 출근 · 다음 주 월요일</div>

  <div class="bill animated" style="position: relative;">
    <span class="label">이번 달 청구</span>
    <span class="amount">1명</span>
    <span class="pulse animated"></span>
  </div>
</div>

<div class="wipe animated"></div>
<script src="../../../../engine/motion/_params.js"></script>
