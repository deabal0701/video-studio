<!doctype html>
<meta charset="utf-8">
<title>계정 상태 네 가지</title>
<!-- 상자 4개가 순서대로 서고, 각 상자의 '문' 아이콘이 상태를 그림으로 말한다.
     발화 시각(실측 36.00s / 234자 기준): 8.9 대기 중 / 14.0 활성화 / 17.9 계정 잠김 / 29.3 비활성화 -->
<link rel="stylesheet" href="../../../../engine/motion/_base.css">
<style>
  .stage { padding: 0 6%; gap: 0; }

  .axis {
    font-size: 3.2vh;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--brand-soft);
    animation-name: fadeUp;
    animation-duration: 0.6s;
    animation-delay: 0.2s;
  }
  .axis b { color: #fff; }

  .grid {
    margin-top: 5.4vh;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2.4vh;
    width: 100%;
  }

  .box {
    padding: 3vh 2vh 2.6vh;
    border-radius: 1.3vh;
    background: #1d1108;
    border: 0.22vh solid #4a2d16;
    animation-name: popIn;
    animation-duration: 0.5s;
    animation-delay: var(--t, 0s);
    animation-timing-function: cubic-bezier(0.2, 1.3, 0.4, 1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: translateY(2vh) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .box.live { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 15%, #1d1108); }

  /* 문 — 열림/닫힘/잠김을 그림으로 */
  .door {
    width: 7vh;
    height: 9vh;
    margin: 0 auto 2vh;
    border-radius: 0.8vh 0.8vh 0 0;
    border: 0.3vh solid #6b4a2e;
    position: relative;
    background: #150d06;
  }
  .door::after {
    content: '';
    position: absolute;
    right: 1vh;
    top: 50%;
    width: 0.9vh;
    height: 0.9vh;
    border-radius: 999px;
    background: #6b4a2e;
  }
  .door.open { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 30%, #150d06); }
  .door.open::after { background: var(--brand-soft); }
  .door.locked { border-color: #c9873f; }
  .door.locked::before {
    content: '🔒';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3.4vh;
  }
  .door.shut { opacity: 0.45; }

  .box .name { font-size: 3vh; font-weight: 800; letter-spacing: -0.02em; }
  .box .desc { margin-top: 1vh; font-size: 2.05vh; font-weight: 600; line-height: 1.35; color: #c2a992; }
</style>

<div class="stage">
  <div class="glow animated"></div>

  <div class="axis animated">계정 상태 = <b>지금 이 서비스를 쓸 수 있는가</b></div>

  <div class="grid">
    <div class="box animated" style="--t: 8.9s">
      <div class="door shut"></div>
      <div class="name">대기 중</div>
      <div class="desc">초대는 갔지만<br>첫 로그인 전</div>
    </div>
    <div class="box live animated" style="--t: 14.0s">
      <div class="door open"></div>
      <div class="name">활성화</div>
      <div class="desc">수락하고<br>실제로 쓰는 중</div>
    </div>
    <div class="box animated" style="--t: 17.9s">
      <div class="door locked"></div>
      <div class="name">계정 잠김</div>
      <div class="desc">비밀번호 만료 ·<br>오류 초과 · 수동 차단</div>
    </div>
    <div class="box animated" style="--t: 29.3s">
      <div class="door shut"></div>
      <div class="name">비활성화</div>
      <div class="desc">퇴직 등 반영구 차단<br>(재입사 시 복구)</div>
    </div>
  </div>
</div>

<div class="wipe animated"></div>
<script src="../../../../engine/motion/_params.js"></script>
