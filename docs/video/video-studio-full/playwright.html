<!doctype html>
<meta charset="utf-8">
<title>화면은 어디서 오나 — 세 경우</title>
<!-- 사용자가 콕 집어 물은 "playwright" 가 무엇을 하는지, 그리고 **경우에 따라 다르다**는 것.

     한 덩어리로 뭉뚱그리면 오해가 남는다. 브라우저(Playwright)가 하는 일이 둘이고,
     아예 브라우저를 안 쓰는 경우가 하나다. 셋을 나란히 놓고, 이 영상이 어느 쪽인지
     세 번째 칸에 표를 달아 준다 — 보는 사람이 자기 경우를 찾을 수 있어야 한다.

     세 번째 칸이 밝은 이유: 지금 보고 있는 이 영상이 그 방식으로 만들어졌다.

     타이밍: 0.5s · 2.3s · 4.1s 로 한 칸씩 → 문구 6.0s

     params:
       title  상단 문구
       h1 b1 f1   1번 칸 제목 · 설명 · 꼬리표
       h2 b2 f2   2번 칸
       h3 b3 f3   3번 칸 (이 영상이 쓰는 방식 — 밝게)
       note   하단 문구
       wipe=off

     주의: `animation:` 단축 속성을 쓰지 않는다. -->
<link rel="stylesheet" href="../../../engine/motion/_base.css">
<style>
  .stage { padding: 6vh 5% 17vh; justify-content: center; gap: 3.6vh; }

  .head {
    font-size: 4.4vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25;
    animation-name: fadeUp; animation-duration: 0.7s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  .cols { display: flex; gap: 1.4vh; width: 100%; align-items: stretch; }
  .c { flex: 1; border-radius: 1.4vh; padding: 2.6vh 2vh;
       display: flex; flex-direction: column; gap: 1.4vh; text-align: left;
       background: #131c34; border: 0.25vh solid #2b3a63; }
  /* 이 영상이 쓰는 방식 — 밝게. 시선이 여기서 멎어야 한다 */
  .c.on { background: #16264a; border-color: var(--brand-soft);
          box-shadow: 0 0 0 0.25vh rgb(158 203 255 / 0.25); }

  .who { font-size: 2vh; font-weight: 800; letter-spacing: -0.01em;
         align-self: flex-start; border-radius: 999px; padding: 0.6vh 1.4vh;
         background: #23386b; color: #9ecbff; }
  .c.on .who { background: linear-gradient(#5aa9ff, #2f7fe0); color: #06182e; }

  .h { font-size: 2.9vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1.3; }
  .b { font-size: 2.1vh; color: #a8b8dc; line-height: 1.45; flex: 1; }
  .f { font-size: 1.95vh; color: #7f91ba; border-top: 0.2vh dashed #2b3a63; padding-top: 1.2vh; line-height: 1.35; }
  .c.on .f { color: #cfe0ff; border-top-color: #3b5390; }

  .c1 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 0.50s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .c2 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 2.30s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .c3 { animation-name: fadeUp; animation-duration: 0.6s; animation-delay: 4.10s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }

  .note { font-size: 2.7vh; color: #93a4cc; line-height: 1.5;
          animation-name: fadeUp; animation-duration: 0.7s; animation-delay: 6.0s;
          animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
</style>

<div class="stage">
  <div class="head animated" data-p="title"></div>

  <div class="cols">
    <div class="c animated c1">
      <span class="who">브라우저</span>
      <span class="h" data-p="h1"></span>
      <span class="b" data-p="b1"></span>
      <span class="f" data-p="f1"></span>
    </div>
    <div class="c animated c2">
      <span class="who">브라우저</span>
      <span class="h" data-p="h2"></span>
      <span class="b" data-p="b2"></span>
      <span class="f" data-p="f2"></span>
    </div>
    <div class="c on animated c3">
      <span class="who">그림 파일</span>
      <span class="h" data-p="h3"></span>
      <span class="b" data-p="b3"></span>
      <span class="f" data-p="f3"></span>
    </div>
  </div>

  <div class="note animated" data-p="note"></div>
  <div class="wipe animated"></div>
</div>
<script src="../../../engine/motion/_params.js"></script>
<script>
  // 등장 시각은 대본이 정한다 — 세 경우를 말하는 순간에 한 칸씩 켜진다.
  (() => {
    const q = new URLSearchParams(location.search);
    const P = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'), tn: q.get('tn') };
    const cols = document.querySelectorAll('.cols .c');
    [['t1', 0.5], ['t2', 2.3], ['t3', 4.1]].forEach(([k, d], i) => {
      if (cols[i]) cols[i].style.animationDelay = `${P[k] ?? d}s`;
    });
    const note = document.querySelector('.note');
    if (note) note.style.animationDelay = `${P.tn ?? 6.0}s`;
  })();
</script>
