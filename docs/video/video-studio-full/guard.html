<!doctype html>
<meta charset="utf-8">
<title>앱이 막아 주는 것 넷</title>
<!-- 대본 작성이 어렵게 느껴지는 큰 이유가 "틀릴까 봐"다.
     그 불안을 덜어 주는 것이 이 그림의 일 — **틀릴 수 있는 자리마다 앱이 먼저 막는다.**

     왼쪽은 겁나는 것(붉은 계열), 오른쪽은 앱이 그것을 막는 방식(푸른 계열).
     가운데 화살표가 "이건 네가 조심할 일이 아니다"를 말한다.
     네 줄이 같은 모양으로 반복되는 것 자체가 "빠짐없이 막혀 있다"는 인상을 준다.

     타이밍: 0.4s 간격으로 한 줄씩 (총 4줄, 1.6s) → 문구 3.6s

     params:
       title  상단 문구
       r1 r2 r3 r4   왼쪽 (틀릴 수 있는 것)
       g1 g2 g3 g4   오른쪽 (앱이 막는 방식)
       note   하단 문구
       wipe=off

     주의: `animation:` 단축 속성을 쓰지 않는다. -->
<link rel="stylesheet" href="../../../engine/motion/_base.css">
<style>
  .stage { padding: 6vh 6% 17vh; justify-content: center; gap: 3vh; }

  .head {
    font-size: 4.6vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25;
    animation-name: fadeUp; animation-duration: 0.7s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  .rows { display: flex; flex-direction: column; gap: 1.5vh; width: 100%; }
  .r { display: flex; align-items: stretch; gap: 1.4vh; }

  .num { flex: 0 0 auto; width: 4.4vh; display: flex; align-items: center; justify-content: center;
         font-size: 2.4vh; font-weight: 800; color: #6f80a8; }

  .risk, .fix { flex: 1; display: flex; align-items: center; padding: 1.6vh 2vh;
                border-radius: 1vh; font-size: 2.35vh; font-weight: 700;
                letter-spacing: -0.02em; line-height: 1.3; text-align: left; }
  /* 틀릴 수 있는 것 — 어둡고 붉다 */
  .risk { background: #2a1520; border: 0.22vh solid #5c2a3a; color: #ffa89a; }
  /* 앱이 막는 방식 — 밝고 푸르다. 시선이 여기서 안심한다 */
  .fix  { background: #16203c; border: 0.22vh solid #3b5390; color: #cfe0ff; }

  .arrow { flex: 0 0 auto; width: 4.4vh; display: flex; align-items: center; justify-content: center;
           font-size: 2.6vh; color: #5aa9ff; font-weight: 800; }

  .a1 { animation-name: fadeUp; animation-duration: 0.55s; animation-delay: 0.40s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .a2 { animation-name: fadeUp; animation-duration: 0.55s; animation-delay: 0.80s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .a3 { animation-name: fadeUp; animation-duration: 0.55s; animation-delay: 1.20s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .a4 { animation-name: fadeUp; animation-duration: 0.55s; animation-delay: 1.60s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }

  .note { font-size: 2.7vh; color: #93a4cc; line-height: 1.5;
          animation-name: fadeUp; animation-duration: 0.7s; animation-delay: 3.6s;
          animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
</style>

<div class="stage">
  <div class="head animated" data-p="title"></div>

  <div class="rows">
    <div class="r animated a1">
      <span class="num">①</span>
      <span class="risk" data-p="r1"></span>
      <span class="arrow">▶</span>
      <span class="fix" data-p="g1"></span>
    </div>
    <div class="r animated a2">
      <span class="num">②</span>
      <span class="risk" data-p="r2"></span>
      <span class="arrow">▶</span>
      <span class="fix" data-p="g2"></span>
    </div>
    <div class="r animated a3">
      <span class="num">③</span>
      <span class="risk" data-p="r3"></span>
      <span class="arrow">▶</span>
      <span class="fix" data-p="g3"></span>
    </div>
    <div class="r animated a4">
      <span class="num">④</span>
      <span class="risk" data-p="r4"></span>
      <span class="arrow">▶</span>
      <span class="fix" data-p="g4"></span>
    </div>
  </div>

  <div class="note animated" data-p="note"></div>
  <div class="wipe animated"></div>
</div>
<script src="../../../engine/motion/_params.js"></script>
<script>
  // 등장 시각은 대본이 정한다 — 네 줄이 각각 그 얘기를 하는 순간에 뜬다.
  (() => {
    const q = new URLSearchParams(location.search);
    const P = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'), t4: q.get('t4'), tn: q.get('tn') };
    const rows = document.querySelectorAll('.rows .r');
    [['t1', 0.4], ['t2', 0.8], ['t3', 1.2], ['t4', 1.6]].forEach(([k, d], i) => {
      if (rows[i]) rows[i].style.animationDelay = `${P[k] ?? d}s`;
    });
    const note = document.querySelector('.note');
    if (note) note.style.animationDelay = `${P.tn ?? 3.6}s`;
  })();
</script>
