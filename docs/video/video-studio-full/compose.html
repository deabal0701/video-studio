<!doctype html>
<meta charset="utf-8">
<title>합성 — 마지막에 얹는 층</title>
<!-- 3단계(합성)가 무엇을 하는지. 요점은 **얹는다**는 것이다.

     앞 단계에서 만든 그림과 목소리가 바탕이고, 그 위에 배경음악·자막·워터마크가
     차례로 덮인다. 그래서 아래에서 위로 쌓이는 애니메이션으로 그린다 —
     "합성"이라는 낱말보다 쌓이는 그림이 먼저 이해된다.

     맨 아래 칸이 가장 먼저 뜨고 위로 올라간다. 순서가 곧 설명이다.

     타이밍: 바탕(0.5s) → 음악(1.7s) → 자막(2.9s) → 워터마크(4.1s) → 산출(5.4s)

     params:
       title  상단 문구
       l4 s4  맨 위 층 (워터마크)
       l3 s3  자막
       l2 s2  배경음악
       l1 s1  바탕 (그림+목소리)
       out    산출 줄
       note   하단 문구
       wipe=off

     주의: `animation:` 단축 속성을 쓰지 않는다. -->
<link rel="stylesheet" href="../../../engine/motion/_base.css">
<style>
  .stage { padding: 6vh 12% 17vh; justify-content: center; gap: 3vh; }

  .head {
    font-size: 4.4vh; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25;
    animation-name: fadeUp; animation-duration: 0.7s;
    animation-timing-function: cubic-bezier(0.2,0.7,0.2,1);
  }

  .stack { width: 100%; display: flex; flex-direction: column; gap: 0.9vh; }
  .ly { display: flex; align-items: center; gap: 1.8vh; text-align: left;
        border-radius: 1.1vh; padding: 1.9vh 2.2vh;
        background: #16203c; border: 0.25vh solid #2b3a63; }
  /* 바탕은 앞 단계 산물이라 색이 다르다 — 새로 얹는 것과 구분된다 */
  .ly.base { background: #1e3358; border-color: #3b5390; }
  .ly .l { flex: 0 0 34%; font-size: 2.7vh; font-weight: 800; letter-spacing: -0.02em; line-height: 1.3; }
  .ly .s { flex: 1; font-size: 2.1vh; color: #a8b8dc; line-height: 1.4; }

  /* 아래에서 위로 얹히는 결 */
  @keyframes layIn { from { opacity: 0; transform: translateY(2.6vh) scale(0.99); } to { opacity: 1; transform: none; } }
  .y1 { animation-name: layIn; animation-duration: 0.6s; animation-delay: 0.50s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .y2 { animation-name: layIn; animation-duration: 0.6s; animation-delay: 1.70s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .y3 { animation-name: layIn; animation-duration: 0.6s; animation-delay: 2.90s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
  .y4 { animation-name: layIn; animation-duration: 0.6s; animation-delay: 4.10s; animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }

  .res { font-size: 2.6vh; font-weight: 800; color: #06182e; letter-spacing: -0.02em;
         background: linear-gradient(#5aa9ff, #2f7fe0); border-radius: 999px;
         padding: 1.2vh 2.6vh; align-self: center;
         animation-name: fadeUp; animation-duration: 0.7s; animation-delay: 5.4s;
         animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }

  .note { font-size: 2.6vh; color: #93a4cc; line-height: 1.5;
          animation-name: fadeUp; animation-duration: 0.7s; animation-delay: 6.4s;
          animation-timing-function: cubic-bezier(0.2,0.7,0.2,1); }
</style>

<div class="stage">
  <div class="head animated" data-p="title"></div>

  <div class="stack">
    <div class="ly animated y4"><span class="l" data-p="l4"></span><span class="s" data-p="s4"></span></div>
    <div class="ly animated y3"><span class="l" data-p="l3"></span><span class="s" data-p="s3"></span></div>
    <div class="ly animated y2"><span class="l" data-p="l2"></span><span class="s" data-p="s2"></span></div>
    <div class="ly base animated y1"><span class="l" data-p="l1"></span><span class="s" data-p="s1"></span></div>
  </div>

  <div class="res animated" data-p="out"></div>
  <div class="note animated" data-p="note"></div>
  <div class="wipe animated"></div>
</div>
<script src="../../../engine/motion/_params.js"></script>
<script>
  // 등장 시각은 대본이 정한다 — 아래(바탕)부터 위로 얹히는 순서 그대로.
  // DOM 은 위에서 아래로 적혀 있으므로 역순으로 물린다.
  (() => {
    const q = new URLSearchParams(location.search);
    const P = { t1: q.get('t1'), t2: q.get('t2'), t3: q.get('t3'),
                t4: q.get('t4'), t5: q.get('t5'), tn: q.get('tn') };
    const n = (v, d) => (v === null || v === undefined || v === '' ? d : Number(v));
    const ly = document.querySelectorAll('.stack .ly');   // [워터마크, 자막, BGM, 바탕]
    const ts = [n(P.t4, 4.1), n(P.t3, 2.9), n(P.t2, 1.7), n(P.t1, 0.5)];
    ly.forEach((el, i) => { el.style.animationDelay = `${ts[i]}s`; });
    const res = document.querySelector('.res');
    if (res) res.style.animationDelay = `${n(P.t5, 5.4)}s`;
    const note = document.querySelector('.note');
    if (note) note.style.animationDelay = `${n(P.tn, 6.4)}s`;
  })();
</script>
